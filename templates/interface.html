<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel - Asis GO+</title>
    <link rel="stylesheet" href="/static/styless.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <h1>Panel del Profesor</h1>
    <p><a href="/workspace">Ver mis clases registradas →</a> | <a href="/">Salir</a></p>

    <h2>Crear Nueva Clase</h2>
    <form id="formulario-materias">
        <input type="text" id="nombre" placeholder="Nombre de la clase" required>
        <br>
        <input type="text" id="seccion" placeholder="Sección (ej: 0801)" required>
        <br>
        <input type="text" id="horario" placeholder="Horario (ej: Lunes 08:00-10:00)" required>
        <br><br>
        <button type="submit">Registrar Clase</button>
    </form>
    <p id="creado"></p>

    <hr>
    <h2>Código QR de Asistencia</h2>
    <p>
        ID Materia: <input type="number" id="id_materia_prueba" placeholder="ej: 1" style="width:60px;">
        <button onclick="abrirModalQR()">Mostrar QR</button>
    </p>

    <div id="modal-qr" style="display:none; border:2px solid #333; padding:20px; width:260px;">
        <div id="contenedor-qr"></div>
        <p id="contador-qr" style="font-size:12px; color:#666;"></p>
        <button onclick="cerrarModalQR()">Cerrar</button>
    </div>

    <script>
    document.getElementById("formulario-materias").addEventListener("submit", async function(e){
        e.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const seccion = document.getElementById("seccion").value;
        const horario = document.getElementById("horario").value;
        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch("http://127.0.0.1:8000/crear_materia", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": "Bearer " + tokenGuardado 
            }, 
            body: JSON.stringify({ nombre, seccion, horario })
        });

        const datos = await respuesta.json();
        if(respuesta.ok){
            document.getElementById("creado").innerText = datos.mensaje;
            document.getElementById("creado").style.color = "green";
            document.getElementById("formulario-materias").reset();
        } else {
            document.getElementById("creado").innerText = "Error: " + datos.detail;
            document.getElementById("creado").style.color = "red";
        }
    });

    let intervaloQR = null;

    async function pedirTokenYPintarQR(idMateria) {
        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch(`http://127.0.0.1:8000/materia/${idMateria}/generar_qr_token`, {
            method: "GET",
            headers: { "Authorization": "Bearer " + tokenGuardado }
        });

        if (!respuesta.ok) {
            document.getElementById("contenedor-qr").innerHTML = "<p>Error generando el codigo.</p>";
            return;
        }

        const datos = await respuesta.json();
        const urlParaElQR = `http://127.0.0.1:8000/marcar?id_materia=${idMateria}&token=${datos.token}`;

        const contenedor = document.getElementById("contenedor-qr");
        contenedor.innerHTML = "";

        new QRCode(contenedor, {
            text: urlParaElQR,
            width: 220,
            height: 220
        });

        let segundos = 15;
        document.getElementById("contador-qr").innerText = `Se renueva en ${segundos}s`;
        const cuentaAtras = setInterval(() => {
            segundos--;
            document.getElementById("contador-qr").innerText = `Se renueva en ${segundos}s`;
            if (segundos <= 0) clearInterval(cuentaAtras);
        }, 1000);
    }

    function abrirModalQR() {
        const idMateria = document.getElementById("id_materia_prueba").value;
        if (!idMateria) {
            alert("Escribe el ID de la materia primero.");
            return;
        }

        document.getElementById("modal-qr").style.display = "block";
        pedirTokenYPintarQR(idMateria);
        intervaloQR = setInterval(() => pedirTokenYPintarQR(idMateria), 15000);
    }

    function cerrarModalQR() {
        document.getElementById("modal-qr").style.display = "none";
        if (intervaloQR) clearInterval(intervaloQR);
    }
    </script>
</body>
</html>
