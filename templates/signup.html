<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Asis GO+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: {
            "background":"#111412","surface":"#111412","surface-container":"#1d201e",
            "surface-container-low":"#191c1a","surface-container-high":"#272b28",
            "surface-container-lowest":"#0b0f0d","on-background":"#e1e3df",
            "on-surface":"#e1e3df","on-surface-variant":"#bfc9c1",
            "primary":"#92d5b2","primary-fixed":"#adf1cd","on-primary":"#003825",
            "on-primary-fixed":"#002114","outline":"#89938c","outline-variant":"#404943"
        }}}
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #191c1a inset !important; -webkit-text-fill-color: #e1e3df !important; }
        @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        .animate-up { animation: slideUp 0.6s ease forwards; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">

<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-5%] left-[-5%] w-72 h-72 bg-primary opacity-5 rounded-full blur-3xl"></div>
</div>

<main class="relative z-10 w-full max-w-md animate-up py-8">

    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center gap-3 mb-3">
            <div class="h-0.5 w-10 bg-primary rounded-full"></div>
            <span class="text-xs font-bold text-primary tracking-widest uppercase">Nueva Cuenta</span>
        </div>
        <h1 class="text-4xl font-black tracking-tighter text-on-background">Únete a <span class="text-primary">Asis GO+</span></h1>
        <p class="text-sm text-on-surface-variant mt-2">Gestión inteligente de asistencia para profesores.</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-container-high rounded-2xl p-6 shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>

        <form id="formulario-registro" class="flex flex-col gap-4">

            <!-- Nombre -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Nombre Completo</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">person</span>
                    <input id="nombre" type="text" required placeholder="Ej. María García"
                        class="w-full bg-surface-container-lowest rounded-xl py-3.5 pl-11 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                </div>
            </div>

            <!-- Correo -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Correo Electrónico</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">mail</span>
                    <input id="correo" type="email" required placeholder="usuario@universidad.edu"
                        class="w-full bg-surface-container-lowest rounded-xl py-3.5 pl-11 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                </div>
            </div>

            <!-- Teléfono -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Teléfono</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">call</span>
                    <input id="telefono" type="text" required placeholder="+504 9999-9999"
                        class="w-full bg-surface-container-lowest rounded-xl py-3.5 pl-11 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                </div>
            </div>

            <div class="h-px bg-outline-variant/30 my-1"></div>

            <!-- Usuario -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Usuario <span class="normal-case tracking-normal font-normal">(6–10 caracteres)</span></label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">alternate_email</span>
                    <input id="usuario" type="text" required placeholder="mi_usuario"
                        class="w-full bg-surface-container-lowest rounded-xl py-3.5 pl-11 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Contraseña <span class="normal-case tracking-normal font-normal">(8–15 caracteres)</span></label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">lock</span>
                    <input id="contrasena" type="password" required placeholder="••••••••"
                        class="w-full bg-surface-container-lowest rounded-xl py-3.5 pl-11 pr-12 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                    <button type="button" onclick="togglePass()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
                        <span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
                    </button>
                </div>
            </div>

            <p id="mensaje" class="text-sm font-semibold text-center min-h-[18px]"></p>

            <button type="submit" id="btn-submit"
                class="group relative w-full bg-primary text-on-primary font-bold text-sm py-4 rounded-xl overflow-hidden transition-all hover:shadow-[0_0_20px_rgba(146,213,178,0.3)] active:scale-95 mt-1 tracking-widest uppercase flex items-center justify-center gap-2">
                Registrarse
                <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-on-surface-variant mt-6">
        ¿Ya tienes cuenta?
        <a href="/iniciar_sesion" class="text-primary font-bold ml-1 hover:underline underline-offset-4">Inicia sesión aquí</a>
    </p>
    <p class="text-center mt-3">
        <a href="/" class="text-xs text-outline hover:text-on-surface transition-colors">← Volver al inicio</a>
    </p>
</main>

<script>
function togglePass() {
    const inp = document.getElementById('contrasena');
    const ico = document.getElementById('eye-icon');
    if (inp.type === 'password') { inp.type = 'text'; ico.textContent = 'visibility_off'; }
    else { inp.type = 'password'; ico.textContent = 'visibility'; }
}

document.getElementById("formulario-registro").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-lg">progress_activity</span> Procesando...';

    const nombre    = document.getElementById("nombre").value;
    const correo    = document.getElementById("correo").value;
    const telefono  = document.getElementById("telefono").value;
    const usuario   = document.getElementById("usuario").value;
    const contrasena = document.getElementById("contrasena").value;

    const respuesta = await fetch("/sign_up", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, telefono, usuario, contrasena })
    });
    const datos = await respuesta.json();

    if (respuesta.ok) {
        sessionStorage.setItem("miTokenJWT", datos.token);
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">check_circle</span> ¡Listo!';
        setTimeout(() => window.location.href = "/workspace", 800);
    } else {
        const msg = document.getElementById("mensaje");
        msg.innerText = datos.detail;
        msg.style.color = "#f87171";
        btn.disabled = false;
        btn.innerHTML = 'Registrarse <span class="material-symbols-outlined text-lg">arrow_forward</span>';
    }
});
</script>
</body>
</html>
