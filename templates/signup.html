<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Asis GO+</title>
    <link rel="stylesheet" href="/static/styless.css">
</head>
<body>
    <h1>Crea tu Cuenta</h1>
    
    <form id="formulario-registro">
        <div>
            <label>Nombre Completo:</label>
            <input type="text" id="nombre" required>
        </div>
        <br>
        <div>
            <label>Correo:</label>
            <input type="email" id="correo" required>
        </div>
        <br>
        <div>
            <label>Teléfono:</label>
            <input type="text" id="telefono" required>
        </div>
        <br>
        <div>
            <label>Usuario (6-10 caracteres):</label>
            <input type="text" id="usuario" required>
        </div>
        <br>
        <div>
            <label>Contraseña (8-15 caracteres):</label>
            <input type="password" id="contrasena" required>
        </div>
        <br>
        <button type="submit">Registrarse</button>
    </form>

    <p id="mensaje"></p>
    <p><a href="/iniciar_sesion">¿Ya tienes cuenta? Inicia sesion aqui</a></p>
    <p><a href="/">← Volver al inicio</a></p>

    <script>
    document.getElementById("formulario-registro").addEventListener("submit", async function(e) {
        e.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const telefono = document.getElementById("telefono").value;
        const usuario = document.getElementById("usuario").value;
        const contrasena = document.getElementById("contrasena").value;

        const respuesta = await fetch("http://127.0.0.1:8000/sign_up", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, correo, telefono, usuario, contrasena })
        });

        const datos = await respuesta.json();

        if (respuesta.ok) {
            sessionStorage.setItem("miTokenJWT", datos.token);
            window.location.href = "/workspace";
        } else {
            document.getElementById("mensaje").innerText = "Error: " + datos.detail;
            document.getElementById("mensaje").style.color = "red";
        }
    });
    </script>
</body>
</html>
