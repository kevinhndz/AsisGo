<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Asis GO+</title>
    <link rel="stylesheet" href="/static/styless.css">
</head>
<body>
    <h1>Inicia Sesión</h1>
    
    <form id="formulario-login">
        <div>
            <label>Usuario:</label>
            <input type="text" id="usuario" required>
        </div>
        <br>
        <div>
            <label>Contraseña:</label>
            <input type="password" id="contrasena" required>
        </div>
        <br>
        <button type="submit">Iniciar Sesion</button>
    </form>

    <p id="bienvenida"></p>
    <p><a href="/sign_up">¿No tienes cuenta? Registrate aqui</a></p>
    <p><a href="/">← Volver al inicio</a></p>

    <script>
    document.getElementById("formulario-login").addEventListener("submit", async function(e) {
        e.preventDefault();
        const usuario = document.getElementById("usuario").value;
        const contrasena = document.getElementById("contrasena").value;

        const respuesta = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario: usuario, contrasena: contrasena })
        });
        
        const datos = await respuesta.json();

        if (respuesta.ok) {
            sessionStorage.setItem("miTokenJWT", datos.token);
            window.location.href = "/workspace";
        } else {
            document.getElementById("bienvenida").innerText = "Error: " + datos.detail;
            document.getElementById("bienvenida").style.color = "red";
        }
    });
    </script>
</body>
</html>
