<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Iniciar Sesión — Asis GO+</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode:"class", theme:{ extend:{ colors:{
  "background":"#131313","surface":"#131313",
  "surface-container":"#201f1f","surface-container-high":"#2a2a2a",
  "surface-container-highest":"#353534","surface-bright":"#3a3939",
  "surface-container-low":"#1c1b1b",
  "on-surface":"#e5e2e1","on-surface-variant":"#e2bfb0",
  "primary":"#ffb693","primary-fixed":"#ffdbcc","on-primary":"#561f00",
  "tertiary":"#8bdc00","outline":"#a98a7d","outline-variant":"#5a4136",
  "error":"#ffb4ab"
}, fontFamily:{
  "body-md":["Geist"],"body-sm":["Geist"],"headline-lg":["Geist"],
  "label-bold":["Geist"],"label-caps":["Geist"],
  "headline-xl":["Geist"],"headline-lg-mobile":["Geist"]
}, fontSize:{
  "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],
  "body-sm":["14px",{lineHeight:"20px",fontWeight:"400"}],
  "headline-lg-mobile":["24px",{lineHeight:"32px",fontWeight:"600"}],
  "label-caps":["12px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"600"}],
  "label-bold":["14px",{lineHeight:"20px",fontWeight:"600"}]
}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;}
  input:-webkit-autofill{-webkit-box-shadow:0 0 0 30px #201f1f inset !important;-webkit-text-fill-color:#e5e2e1 !important;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .animate-spin{animation:spin 1s linear infinite;}
  .animate-pulse{animation:pulse 2s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
</style>
</head>
<body class="bg-background pt-safe pb-safe" style="font-family:'Geist',sans-serif;">

<main class="relative w-full min-h-screen flex flex-col">
  <div class="flex flex-col w-full relative overflow-hidden flex-1 items-center">

    <!-- Ambient blobs -->
    <div class="absolute top-0 left-0 w-full h-[400px] overflow-hidden -z-10 pointer-events-none flex justify-center">
      <div class="w-[300px] h-[300px] bg-primary/10 rounded-full blur-[80px] absolute -top-20 opacity-70"></div>
      <div class="w-[200px] h-[200px] bg-tertiary/10 rounded-full blur-[60px] absolute top-20 -left-10 opacity-60"></div>
    </div>

    <!-- Header -->
    <div class="px-6 pt-8 pb-6 flex flex-col gap-3">
      <div class="inline-flex items-center gap-2 bg-surface-container-high text-on-surface px-4 py-2 rounded-full self-start shadow-md">
        <div class="w-2 h-2 rounded-full bg-tertiary animate-pulse shadow-[0_0_8px_rgba(139,220,0,0.6)]"></div>
        <span class="font-label-caps text-label-caps uppercase text-on-surface tracking-widest">Sistema en línea</span>
      </div>
      <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-6 tracking-tight">Bienvenido a Asis GO+</h1>
      <p class="font-body-md text-body-md text-on-surface-variant pr-4">Accede al panel de gestión de asistencia.</p>
    </div>

    <!-- Card -->
    <div class="mx-6 max-w-sm w-full self-center bg-surface-container text-on-surface rounded-2xl p-8 shadow-2xl flex flex-col gap-8 relative z-10 mb-8">

      <form class="flex flex-col gap-6" id="formulario-login" onsubmit="handleLogin(event)">

        <!-- Usuario -->
        <label class="flex flex-col gap-3">
          <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Usuario</span>
          <div class="relative flex items-center group">
            <span class="material-symbols-outlined absolute left-5 text-on-surface-variant group-focus-within:text-primary transition-colors">badge</span>
            <input id="usuario" type="text" required placeholder="Tu usuario"
              class="w-full bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-lg pl-14 pr-6 py-4 focus:outline-none focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/30 shadow-inner">
          </div>
        </label>

        <!-- Contraseña -->
        <label class="flex flex-col gap-3">
          <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Contraseña</span>
          <div class="relative flex items-center group">
            <span class="material-symbols-outlined absolute left-5 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
            <input id="contrasena" type="password" required placeholder="••••••••"
              class="w-full bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-lg pl-14 pr-14 py-4 focus:outline-none focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/30 shadow-inner">
            <button type="button" onclick="togglePass()" class="absolute right-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container">
              <span class="material-symbols-outlined" id="eye-icon">visibility</span>
            </button>
          </div>
        </label>

        <!-- Options -->
        <div class="flex items-center justify-between pl-1">
          <label class="flex items-center gap-3 cursor-pointer group">
            <div class="w-5 h-5 rounded bg-surface-container-highest flex items-center justify-center group-hover:bg-surface-bright transition-colors relative overflow-hidden">
              <input type="checkbox" checked class="opacity-0 absolute inset-0 cursor-pointer peer">
              <div class="absolute inset-0 bg-primary opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">
                <span class="material-symbols-outlined text-[16px] text-on-primary font-bold">check</span>
              </div>
            </div>
            <span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
          </label>
          <a href="#" class="font-label-bold text-label-bold text-primary hover:text-primary-fixed transition-colors">Recuperar acceso</a>
        </div>

        <!-- Mensaje error -->
        <p id="msg-error" class="text-sm font-semibold text-center text-error min-h-[18px]"></p>

        <!-- Submit -->
        <button type="submit" id="btn-submit"
          class="w-full h-14 bg-primary text-on-primary rounded-full font-label-bold text-label-bold flex items-center justify-center gap-2 hover:bg-primary-fixed hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
          <span id="btn-text">Iniciar Sesión</span>
          <span class="material-symbols-outlined text-sm" id="btn-icon" style="font-variation-settings:'FILL' 1;">arrow_forward</span>
          <span id="btn-loader" class="hidden"><span class="material-symbols-outlined animate-spin">progress_activity</span></span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="mt-auto text-center pb-10 px-6">
      <p class="font-body-sm text-body-sm text-on-surface-variant opacity-60">
        ¿No tienes cuenta?
        <a href="/sign_up" class="text-primary hover:text-primary-fixed transition-colors ml-1 font-semibold">Regístrate aquí</a>
      </p>
      <p class="font-body-sm text-body-sm text-on-surface-variant opacity-30 mt-3">
        Asis GO+ v2.4 · <a href="/" class="hover:opacity-60 transition-opacity">Inicio</a>
      </p>
    </div>

  </div>
</main>

<script>
function togglePass() {
  const inp = document.getElementById('contrasena');
  const ico = document.getElementById('eye-icon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn    = document.getElementById('btn-submit');
  const txt    = document.getElementById('btn-text');
  const ico    = document.getElementById('btn-icon');
  const loader = document.getElementById('btn-loader');
  const msgEl  = document.getElementById('msg-error');

  btn.classList.add('pointer-events-none');
  txt.style.transform = 'translateY(20px)';
  ico.style.transform = 'translateY(20px)';
  loader.classList.remove('hidden');
  msgEl.innerText = '';

  // BUG #2: try/catch global para que un error de red no rompa la UI
  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario:    document.getElementById('usuario').value.trim(),
        contrasena: document.getElementById('contrasena').value
      })
    });

    let datos = {};
    try { datos = await resp.json(); } catch (_) {}

    loader.classList.add('hidden');
    txt.style.transform = 'translateY(0)';
    ico.style.transform = 'translateY(0)';

    if (resp.ok) {
      sessionStorage.setItem('miTokenJWT', datos.token);
      txt.innerText = '¡Bienvenido!';
      ico.textContent = 'check_circle';
      setTimeout(() => window.location.href = '/workspace', 700);
    } else {
     
      let mensajeError;
      if (typeof datos.detail === 'string') {
        mensajeError = datos.detail;
      } else if (Array.isArray(datos.detail)) {
        // Pydantic v2: array de objetos de validación → unimos los msg
        mensajeError = datos.detail.map(err => err.msg || JSON.stringify(err)).join(', ');
      } else if (resp.status === 401) {
        mensajeError = 'Usuario o contraseña incorrectos.';
      } else if (resp.status === 422) {
        mensajeError = 'Datos inválidos. El usuario debe tener entre 6 y 10 caracteres.';
      } else {
        mensajeError = 'Ocurrió un error inesperado. Intenta de nuevo.';
      }
      msgEl.innerText = mensajeError;
      btn.classList.remove('pointer-events-none');
    }

  } catch (errorRed) {
   
    loader.classList.add('hidden');
    txt.style.transform = 'translateY(0)';
    ico.style.transform = 'translateY(0)';
    msgEl.innerText = 'Error de conexión. Verifica tu internet e intenta de nuevo.';
    btn.classList.remove('pointer-events-none');
  }
}


(function mostrarAvisoSiExpiro() {
  if (new URLSearchParams(window.location.search).get('sesion') === 'expirada') {
    const msgEl = document.getElementById('msg-error');
    msgEl.style.color = '#ffb693'; // color primario, no de error (es aviso, no fallo)
    msgEl.innerText = 'Sesión cerrada. Debes iniciar sesión de nuevo.';
  }
})();
</script>
</body>
</html>
