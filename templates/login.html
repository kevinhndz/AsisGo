<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Asis GO+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: {
            "background":"#111412","surface":"#111412","surface-container":"#1d201e",
            "surface-container-low":"#191c1a","surface-container-high":"#272b28",
            "surface-container-lowest":"#0b0f0d","on-background":"#e1e3df",
            "on-surface":"#e1e3df","on-surface-variant":"#bfc9c1",
            "primary":"#92d5b2","primary-fixed":"#adf1cd","on-primary":"#003825",
            "on-primary-fixed":"#002114","outline":"#89938c","outline-variant":"#404943"
        }}}
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #191c1a inset !important; -webkit-text-fill-color: #e1e3df !important; }
        @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        .animate-up { animation: slideUp 0.6s ease forwards; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">

<!-- Background blur blobs -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-primary opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 left-1/4 w-64 h-64 bg-primary opacity-5 rounded-full blur-3xl"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-background via-transparent to-background"></div>
</div>

<main class="relative z-10 w-full max-w-md animate-up">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-10 text-center">
        <div class="w-16 h-16 bg-primary-fixed rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
            <span class="material-symbols-outlined text-on-primary-fixed" style="font-size:32px; font-variation-settings:'FILL' 1;">rocket_launch</span>
        </div>
        <h1 class="text-5xl font-black tracking-tighter text-on-background">Asis <span class="text-primary">GO+</span></h1>
        <p class="text-xs text-on-surface-variant mt-2 tracking-widest uppercase opacity-70">Sistema de Asistencia Híbrida</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-container rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

        <form id="formulario-login" class="space-y-5">

            <!-- Usuario -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-2 tracking-widest uppercase transition-colors group-focus-within:text-primary">Usuario</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl transition-colors group-focus-within:text-primary">person</span>
                    <input id="usuario" type="text" required placeholder="Tu usuario"
                        class="w-full bg-surface-container-low rounded-xl py-4 pl-12 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline/50"/>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="group">
                <label class="block text-xs font-bold text-on-surface-variant mb-2 tracking-widest uppercase transition-colors group-focus-within:text-primary">Contraseña</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl transition-colors group-focus-within:text-primary">lock</span>
                    <input id="contrasena" type="password" required placeholder="••••••••"
                        class="w-full bg-surface-container-low rounded-xl py-4 pl-12 pr-12 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline/50"/>
                    <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
                        <span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
                    </button>
                </div>
            </div>

            <p id="bienvenida" class="text-sm font-semibold text-center min-h-[20px]"></p>

            <!-- Submit -->
            <button type="submit" id="btn-submit"
                class="w-full bg-primary-fixed text-on-primary-fixed font-bold text-sm py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary transition-all active:scale-95 shadow-lg shadow-primary/20 mt-2 tracking-widest uppercase">
                Iniciar Sesión
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
            </button>
        </form>

        <div class="absolute -bottom-10 -right-10 w-28 h-28 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-on-surface-variant mt-6">
        ¿No tienes cuenta?
        <a href="/sign_up" class="text-primary-fixed font-bold ml-1 hover:underline underline-offset-4">Regístrate aquí</a>
    </p>
    <p class="text-center mt-3">
        <a href="/" class="text-xs text-outline hover:text-on-surface transition-colors">← Volver al inicio</a>
    </p>
</main>

<script>
function togglePass() {
    const inp = document.getElementById('contrasena');
    const ico = document.getElementById('eye-icon');
    if (inp.type === 'password') { inp.type = 'text'; ico.textContent = 'visibility_off'; }
    else { inp.type = 'password'; ico.textContent = 'visibility'; }
}

document.getElementById("formulario-login").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span> Accediendo...';

    const usuario   = document.getElementById("usuario").value;
    const contrasena = document.getElementById("contrasena").value;

    const respuesta = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, contrasena })
    });
    const datos = await respuesta.json();

    if (respuesta.ok) {
        sessionStorage.setItem("miTokenJWT", datos.token);
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">check_circle</span> Bienvenido';
        setTimeout(() => window.location.href = "/workspace", 800);
    } else {
        const msg = document.getElementById("bienvenida");
        msg.innerText = datos.detail;
        msg.style.color = "#f87171";
        btn.disabled = false;
        btn.innerHTML = 'Iniciar Sesión <span class="material-symbols-outlined text-lg">arrow_forward</span>';
    }
});
</script>
</body>
</html>
