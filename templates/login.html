<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Asis GO+ - Inicio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'bg-dark': '#1a1a1a',
        'bg-light': '#fdfcf7',
        'accent-orange': '#f97316',
      }
    }
  }
}
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .bottom-cutout { border-top-left-radius: 2rem; }
</style>
</head>
<!-- Fondo oscuro directo en body, sin wrapper claro -->
<body class="bg-bg-dark min-h-screen flex flex-col">

  <!-- Nav — sobre fondo oscuro, sin bg propio -->
  <header class="flex justify-between items-center z-20 relative px-6 md:px-10 pt-5 pb-4">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg border-2 border-[#e5e5e5] flex items-center justify-center">
        <svg class="h-4 w-4 text-[#e5e5e5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
      <span class="text-white font-medium text-lg tracking-wide">ASIS GO+</span>
    </div>

    <!-- Right actions — sin nav pills -->
    <div class="flex items-center gap-3">
      <a href="/iniciar_sesion"
         class="flex items-center gap-2 text-white border border-gray-600 rounded-full px-4 py-2 text-sm hover:bg-gray-800 transition-colors">
        Iniciar sesión
      </a>
      <a href="/sign_up"
         class="flex items-center gap-3 text-white border border-gray-600 rounded-full pl-2 pr-4 py-1.5 text-sm hover:bg-gray-800 transition-colors">
        <div class="bg-white text-black rounded-full p-1">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </div>
        Conectar
      </a>
    </div>
  </header>

  <!-- Hero — fondo claro ocupa el resto -->
  <section class="bg-bg-light flex-1 rounded-[2.5rem] mx-4 mb-4 flex flex-col md:flex-row relative z-10 pt-16 md:pt-20 pb-20 px-6 md:px-16 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>

    <!-- Left: copy -->
    <div class="flex-1 flex flex-col justify-center relative z-20 max-w-2xl">
      <h1 class="text-5xl md:text-7xl lg:text-[5.5rem] leading-[1.1] font-semibold text-gray-900 mb-6 tracking-tight">
        Asistencia sin
        <span class="flex items-center flex-wrap gap-4 mt-2">
          <div class="w-12 h-12 md:w-16 md:h-16 inline-flex flex-shrink-0 mt-2">
            <svg class="w-full h-full" fill="none" viewBox="0 0 100 100">
              <path d="M50 15L85 32.5V67.5L50 85L15 67.5V32.5L50 15Z" fill="white" stroke="#f97316" stroke-width="4"/>
              <path d="M50 30L70 40V60L50 70L30 60V40L50 30Z" fill="none" stroke="black" stroke-width="3"/>
              <circle cx="50" cy="50" fill="black" r="5"/>
            </svg>
          </div>
          fricciones.
        </span>
      </h1>

      <div class="mt-8 md:mt-16 border-t border-gray-300 pt-6">
        <a href="/iniciar_sesion"
           class="inline-flex items-center gap-3 text-lg font-medium text-gray-900 group">
          <div class="bg-black text-white rounded-full p-1.5 group-hover:bg-gray-800 transition-colors">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </div>
          Comenzar
        </a>
        <p class="text-gray-500 text-sm md:text-base mt-4 max-w-md leading-relaxed">
          Gestión de asistencia híbrida diseñada para la claridad y la velocidad.
          QR dinámico, validación por ubicación y grabaciones automáticas.
        </p>
      </div>
    </div>

    <!-- Right: graphic -->
    <div class="flex-1 relative z-20 flex justify-center items-center mt-12 md:mt-0 min-h-[300px] md:min-h-0">
      <div class="relative w-full max-w-[500px] aspect-square flex items-center justify-center">
        <img
          alt="Asis GO+ Gráfico"
          class="w-full h-auto object-contain drop-shadow-2xl opacity-80"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_sjurwOSXZmrGxmCC9Ve3qSKwaSs0cZVs2wQ6iVZVCEGBKPRT4yuuocmSRXJ8c_wychPAOizKGRMx9_dzLb6d67QUX0yCJC_BzXeSGrmu-8di0Tb195rRko3yq0aOzHBcnb9265VBOOo_nnnrAMdv1DTmg6ksmthWSchnDXHGXcmMu8348mgr_R_fETGomJXdj2v5NBvtFJCo5VEB0cLn93XYKVOVXoqkIVXLY4mupye1Mt9zab3vsA">
        <div class="absolute inset-0 bg-gradient-to-t from-bg-light/20 to-transparent mix-blend-overlay"></div>
      </div>
    </div>

    <!-- Bottom bar — dentro del hero claro, alineado a la derecha inferior -->
    <div class="absolute bottom-0 right-0 bg-bg-dark bottom-cutout pl-6 pt-4 pb-4 pr-6 sm:pr-8 flex items-center gap-4 text-white">
      <a href="/iniciar_sesion" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Iniciar Sesión</a>
      <div class="flex bg-gray-800 rounded-full p-1 border border-gray-700">
        <a href="/sign_up" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-black shadow-sm hover:bg-gray-100 transition-colors">Registrar</a>
      </div>
    </div>
  </section>

</body>
</html>
