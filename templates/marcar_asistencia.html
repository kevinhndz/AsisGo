<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcar Asistencia — Asis GO+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: {
            "background":"#131313","surface":"#131313","surface-container":"#201f1f",
            "surface-container-low":"#1c1b1b","surface-container-high":"#2a2a2a",
            "surface-container-lowest":"#0e0e0e","on-background":"#e5e2e1",
            "on-surface":"#e5e2e1","on-surface-variant":"#e2bfb0",
            "primary":"#ffb693","primary-fixed":"#ffdbcc","on-primary":"#561f00",
            "on-primary-fixed":"#351000","outline":"#a98a7d","outline-variant":"#5a4136"
        }}}
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Geist', sans-serif; }
        .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; font-size:24px; line-height:1; display:inline-block; white-space:nowrap; -webkit-font-smoothing:antialiased; }
        input:-webkit-autofill { -webkit-box-shadow:0 0 0 30px #1c1b1b inset !important; -webkit-text-fill-color:#e5e2e1 !important; }
        @keyframes pulse-ring { 0%{transform:scale(0.8);opacity:0.8;} 100%{transform:scale(1.4);opacity:0;} }
        .pulse-ring { animation: pulse-ring 1.5s ease infinite; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">

<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/3 w-72 h-72 bg-primary opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/3 left-1/3 w-48 h-48 bg-primary opacity-5 rounded-full blur-3xl"></div>
</div>

<main class="relative z-10 w-full max-w-sm py-8">

    <!-- Logo -->
    <div class="text-center mb-8">
        <span class="text-xl font-black tracking-tighter">Asis <span class="text-primary">GO+</span></span>
    </div>

    <!-- Location status -->
    <div id="estado-ubicacion-card" class="bg-surface-container rounded-2xl p-5 mb-4 flex items-center gap-4 border border-outline-variant/20">
        <div class="relative flex-shrink-0">
            <div class="w-10 h-10 bg-primary/20 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-primary text-xl" id="icono-ubicacion" style="font-variation-settings:'FILL' 1;">my_location</span>
            </div>
            <div class="absolute inset-0 bg-primary/20 rounded-full pulse-ring" id="pulse-anim"></div>
        </div>
        <div class="flex-1">
            <p id="estado-ubicacion" class="text-sm text-on-surface-variant">Intentando obtener ubicación...</p>
            <!-- Botón para pedir ubicación manualmente si el browser no la pidió solo -->
            <button id="btn-pedir-ubicacion" onclick="pedirUbicacionManual()"
                class="mt-2 text-xs font-bold text-primary underline underline-offset-2 hover:opacity-70 transition-opacity hidden">
                Intentar de nuevo con ubicación
            </button>
        </div>
    </div>

    <!-- Form card — se muestra en cuanto se resuelve la ubicación (con o sin éxito) -->
    <div id="formulario-container" style="display:none;">
        <div class="bg-surface-container rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>

            <h1 class="text-2xl font-black tracking-tighter text-on-background mb-1">Marcar Asistencia</h1>
            <p class="text-xs text-on-surface-variant mb-5">Ingresa tu número de cuenta para registrar tu presencia.</p>

            <form id="formulario-asistencia" class="flex flex-col gap-4">
                <div class="group">
                    <label class="block text-xs font-bold text-on-surface-variant mb-1.5 tracking-widest uppercase group-focus-within:text-primary transition-colors">Número de Cuenta</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-xl group-focus-within:text-primary transition-colors">badge</span>
                        <input id="numero_cuenta" type="text" required placeholder="20210001234"
                            class="w-full bg-surface-container-low rounded-xl py-3.5 pl-11 pr-4 text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50"/>
                    </div>
                </div>

                <p id="mensaje" class="text-sm font-semibold text-center min-h-[18px]"></p>

                <button type="submit" id="btn-marcar"
                    class="w-full bg-primary-fixed text-on-primary-fixed font-bold text-sm py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary transition-all active:scale-95 shadow-md shadow-primary/20 tracking-widest uppercase">
                    <span class="material-symbols-outlined text-lg">how_to_reg</span>
                    Marcar Asistencia
                </button>
            </form>
        </div>
    </div>

    <!-- Success state -->
    <div id="estado-exito" style="display:none;" class="bg-surface-container rounded-2xl p-8 text-center shadow-xl border border-primary/20">
        <div class="w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-primary" style="font-size:36px; font-variation-settings:'FILL' 1;">check_circle</span>
        </div>
        <p id="mensaje-exito" class="text-lg font-bold text-on-background"></p>
        <p class="text-sm text-on-surface-variant mt-2">Tu asistencia ha sido registrada.</p>
    </div>

</main>

<script>
const parametros   = new URLSearchParams(window.location.search);
const idMateria    = parametros.get("id_materia");

const TOKEN_DEL_QR = parametros.get("token");

let ubicacion = { lat: null, lng: null };


let resolverUbicacion = null;
const promesaUbicacion = new Promise(resolve => { resolverUbicacion = resolve; });

function mostrarForm() {
    document.getElementById("formulario-container").style.display = "block";
    document.getElementById("pulse-anim").style.display = "none";
}

function setEstadoUbicacion(icono, texto, mostrarBotonReintentar) {
    document.getElementById("icono-ubicacion").textContent = icono;
    document.getElementById("estado-ubicacion").innerText = texto;
    document.getElementById("btn-pedir-ubicacion").classList.toggle("hidden", !mostrarBotonReintentar);
}

let watchId       = null;   // ID del watchPosition activo
let timeoutGPS    = null;   // ID del setTimeout de respaldo

function iniciarGPS() {
    // Limpiar cualquier intento anterior
    if (watchId !== null)    { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (timeoutGPS !== null) { clearTimeout(timeoutGPS); timeoutGPS = null; }

    if (!navigator.geolocation) {
        setEstadoUbicacion("location_off", "Tu navegador no soporta geolocalización — se registrará sin validar rango.", false);
        resolverUbicacion({ lat: null, lng: null });
        mostrarForm();
        return;
    }

    setEstadoUbicacion("my_location", "Solicitando permiso de ubicación...", false);

  
    watchId = navigator.geolocation.watchPosition(
        function onExito(pos) {
            // Limpiamos el watch apenas tenemos la primera posición válida
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (timeoutGPS !== null) { clearTimeout(timeoutGPS); timeoutGPS = null; }

            const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            ubicacion = coords;
            setEstadoUbicacion("location_on", `Ubicación obtenida ✓ (±${Math.round(pos.coords.accuracy)}m)`, false);
            resolverUbicacion(coords);
            mostrarForm();
        },
        function onError(err) {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (timeoutGPS !== null) { clearTimeout(timeoutGPS); timeoutGPS = null; }

            const msgs = {
                1: "Permiso denegado — se registrará sin validar rango GPS.",
                2: "Ubicación no disponible — se registrará sin validar rango GPS.",
                3: "Tiempo agotado — se registrará sin validar rango GPS."
            };
            // Solo mostramos "Reintentar" cuando el permiso fue denegado (código 1),
            // porque en los otros casos reintentar no sirve de mucho.
            setEstadoUbicacion("location_off", msgs[err.code] || "Sin ubicación.", err.code === 1);
            resolverUbicacion({ lat: null, lng: null });
            mostrarForm();
        },
        
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );

  
    timeoutGPS = setTimeout(() => {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        setEstadoUbicacion(
            "location_off",
            "No se recibió respuesta del GPS. Puedes marcar igual o reintentar.",
            true
        );
        resolverUbicacion({ lat: null, lng: null });
        mostrarForm();
    }, 17000); // 2 s más que el timeout interno de watchPosition
}

function pedirUbicacionManual() {
    // Al reintentar manualmente solo actualizamos la UI y volvemos a pedir GPS.
    // La promesaUbicacion ya se resolvió; ahora actualizamos `ubicacion` directo.
    ubicacion = { lat: null, lng: null };
    if (watchId !== null)    { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (timeoutGPS !== null) { clearTimeout(timeoutGPS); timeoutGPS = null; }

    if (!navigator.geolocation) return;

    setEstadoUbicacion("my_location", "Reintentando obtener ubicación...", false);
    document.getElementById("btn-pedir-ubicacion").classList.add("hidden");

    watchId = navigator.geolocation.watchPosition(
        function(pos) {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            ubicacion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setEstadoUbicacion("location_on", `Ubicación obtenida ✓ (±${Math.round(pos.coords.accuracy)}m)`, false);
        },
        function(err) {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            setEstadoUbicacion("location_off", "No se pudo obtener la ubicación.", true);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
}

// Arrancar GPS al cargar la página
iniciarGPS();

// ─── ENVIAR ASISTENCIA ───────────────────────────────────────────────────────
document.getElementById("formulario-asistencia").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn   = document.getElementById("btn-marcar");
    const msgEl = document.getElementById("mensaje");

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-lg">progress_activity</span> Registrando...';
    msgEl.innerText = "";

    const numero_cuenta = document.getElementById("numero_cuenta").value.trim();

    const tokenAEnviar = TOKEN_DEL_QR;

    try {
        const respuesta = await fetch(`/marcar_asistencia?id_materia=${idMateria}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token:         tokenAEnviar,
                numero_cuenta: numero_cuenta,
                lat:           ubicacion.lat,
                lng:           ubicacion.lng
            })
        });
        const datos = await respuesta.json();

        if (respuesta.ok) {
            document.getElementById("formulario-container").style.display  = "none";
            document.getElementById("estado-ubicacion-card").style.display = "none";
            document.getElementById("estado-exito").style.display          = "block";
            document.getElementById("mensaje-exito").innerText             = datos.mensaje;
        } else {
            msgEl.innerText    = datos.detail;
            msgEl.style.color  = "#ffb4ab";
            btn.disabled       = false;
            btn.innerHTML      = '<span class="material-symbols-outlined text-lg">how_to_reg</span> Marcar Asistencia';
        }
    } catch (_) {
        msgEl.innerText   = "Error de red. Verifica tu conexión e intenta de nuevo.";
        msgEl.style.color = "#ffb4ab";
        btn.disabled      = false;
        btn.innerHTML     = '<span class="material-symbols-outlined text-lg">how_to_reg</span> Marcar Asistencia';
    }
});
</script>
</body>
</html>
