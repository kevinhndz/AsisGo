<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Clases</title>
    <link rel="stylesheet" href="/static/styless.css">
</head>
<body>
    <h1>Mis Clases</h1>
    <p><a href="/interface">← Panel</a> | <a href="/">Salir</a></p>

    <div id="contenedor-materias">
        <p>Cargando clases...</p>
    </div>

    <div id="vista-detalle-clase" style="display:none;">
        <button onclick="volverALista()">← Volver</button>
        <h2 id="titulo-clase"></h2>

        <h3>Ubicación del Aula</h3>
        <button onclick="guardarUbicacion()">Usar mi ubicación actual</button>
        <p id="estado-ubicacion"></p>

        <h3>Estudiantes Inscritos</h3>
        <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Cuenta</th>
                    <th>Modalidad</th>
                    <th>Faltas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <tr><td colspan="6">Cargando estudiantes...</td></tr>
            </tbody>
        </table>

        <br>
        <button onclick="cerrarClase()">Cerrar Clase (marcar ausentes)</button>
        <p id="estado-cierre"></p>

        <h3>Publicar Grabación</h3>
        <input type="text" id="url-grabacion" placeholder="Pega URL de Teams/Drive/OneDrive" style="width:300px;">
        <button onclick="publicarGrabacion()">Publicar y enviar correos</button>
        <p id="estado-grabacion"></p>
    </div>

    <script>
    let idMateriaActual = null;

    async function cargarClases() {
        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch("http://127.0.0.1:8000/mis_materias", {
            method: "GET",
            headers: { "Authorization": "Bearer " + tokenGuardado }
        });

        const materias = await respuesta.json();
        const contenedor = document.getElementById("contenedor-materias");

        if (respuesta.ok && materias.length > 0) {
            let html = "<ul>";
            materias.forEach(m => {
                html += `<li>
                    <strong>${m.nombre}</strong> (${m.seccion})
                    <button onclick="irAClase(${m.id_materia}, '${m.nombre}')">Entrar</button>
                </li>`;
            });
            html += "</ul>";
            contenedor.innerHTML = html;
        } else {
            contenedor.innerHTML = "<p>No tienes clases registradas.</p>";
        }
    }

    function irAClase(idMateria, nombre) {
        idMateriaActual = idMateria;
        document.getElementById("contenedor-materias").style.display = "none";
        document.getElementById("vista-detalle-clase").style.display = "block";
        document.getElementById("titulo-clase").innerText = nombre;
        cargarEstudiantes();
    }

    function volverALista() {
        document.getElementById("vista-detalle-clase").style.display = "none";
        document.getElementById("contenedor-materias").style.display = "block";
        idMateriaActual = null;
    }

    async function cargarEstudiantes() {
        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch(`http://127.0.0.1:8000/materia/${idMateriaActual}/estudiantes`, {
            method: "GET",
            headers: { "Authorization": "Bearer " + tokenGuardado }
        });

        const estudiantes = await respuesta.json();
        const cuerpo = document.getElementById("cuerpo-tabla");

        if (!respuesta.ok) {
            cuerpo.innerHTML = `<tr><td colspan="6">Error: ${estudiantes.detail}</td></tr>`;
            return;
        }

        if (estudiantes.length === 0) {
            cuerpo.innerHTML = `<tr><td colspan="6">Sin estudiantes inscritos aún.</td></tr>`;
            return;
        }

        let html = "";
        estudiantes.forEach(e => {
            html += `<tr>
                <td>${e.nombre}</td>
                <td>${e.correo}</td>
                <td>${e.numero_cuenta}</td>
                <td>${e.modalidad}</td>
                <td>${e.faltas}</td>
                <td>
                    <button onclick="eliminarEstudiante(${e.id_estudiante})">Eliminar</button>
                </td>
            </tr>`;
        });

        cuerpo.innerHTML = html;
    }

    async function eliminarEstudiante(idEstudiante) {
        if (!confirm("¿Eliminar este estudiante?")) return;

        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch(`http://127.0.0.1:8000/estudiante/${idEstudiante}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + tokenGuardado }
        });

        if (respuesta.ok) {
            cargarEstudiantes();
        } else {
            const datos = await respuesta.json();
            alert("Error: " + datos.detail);
        }
    }

    async function guardarUbicacion() {
        navigator.geolocation.getCurrentPosition(async function(posicion) {
            const tokenGuardado = sessionStorage.getItem("miTokenJWT");
            const lat = posicion.coords.latitude;
            const lng = posicion.coords.longitude;

            const respuesta = await fetch(
                `http://127.0.0.1:8000/materia/${idMateriaActual}/configurar_ubicacion?lat=${lat}&lng=${lng}`,
                { method: "POST", headers: { "Authorization": "Bearer " + tokenGuardado } }
            );

            const datos = await respuesta.json();
            document.getElementById("estado-ubicacion").innerText =
                respuesta.ok ? "✓ " + datos.mensaje : "Error: " + datos.detail;
        });
    }

    async function cerrarClase() {
        if (!confirm("Marcar ausentes a quienes no escanearon?")) return;

        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch(`http://127.0.0.1:8000/materia/${idMateriaActual}/cerrar_clase`, {
            method: "POST",
            headers: { "Authorization": "Bearer " + tokenGuardado }
        });

        const datos = await respuesta.json();
        document.getElementById("estado-cierre").innerText =
            respuesta.ok ? "✓ " + datos.mensaje : "Error: " + datos.detail;
    }

    async function publicarGrabacion() {
        const url = document.getElementById("url-grabacion").value;
        if (!url) {
            alert("Pega el URL de la grabacion");
            return;
        }

        const tokenGuardado = sessionStorage.getItem("miTokenJWT");

        const respuesta = await fetch(
            `http://127.0.0.1:8000/materia/${idMateriaActual}/publicar_grabacion?url_video=${encodeURIComponent(url)}`,
            { method: "POST", headers: { "Authorization": "Bearer " + tokenGuardado } }
        );

        const datos = await respuesta.json();
        document.getElementById("estado-grabacion").innerText =
            respuesta.ok ? "✓ " + datos.mensaje : "Error: " + datos.detail;

        if (respuesta.ok) {
            document.getElementById("url-grabacion").value = "";
        }
    }

    cargarClases();
    </script>
</body>
</html>
