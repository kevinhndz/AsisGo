name: Validar y desplegar AsisGo

on:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Validar dependencias
        run: composer validate --no-check-publish

      - name: Validar rutas Laravel
        run: php artisan route:list --except-vendor

      - name: Construir imagen de producción
        run: docker build -t asisgo:ci .

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el servidor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
